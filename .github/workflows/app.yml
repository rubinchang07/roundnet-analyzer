name: App

on:
  push:
    paths-ignore: ["db/**", ".github/workflows/db.yml"]
  pull_request:
    paths-ignore: ["db/**", ".github/workflows/db.yml"]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
